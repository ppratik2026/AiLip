<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}AiLip{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

  <!-- ── Navbar ──────────────────────────────────────────────────────────── -->
  <nav class="navbar">
    <a href="/" class="logo">
      <span class="logo-text">Ai<span class="grad">Lip</span></span>
    </a>
    <div class="nav-links">
      <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 21V9"/></svg>
        Image → Video
      </a>
      <a href="/lipsync" class="nav-link {% if request.path == '/lipsync' %}active{% endif %}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        Lipsync
      </a>
    </div>
  </nav>

  <!-- ── Demo mode banner ─────────────────────────────────────────────────── -->
  {% if demo_mode %}
  <div class="demo-banner">
    ⚡ <strong>Demo Mode</strong> — Lipsync model skipped (audio-mux only). Run <code>bash setup.sh</code> for full GPU pipeline.
  </div>
  {% endif %}

  <!-- ── Main content ─────────────────────────────────────────────────────── -->
  <main class="main">
    {% block content %}{% endblock %}
  </main>

  <!-- ── Footer ──────────────────────────────────────────────────────────── -->
  <footer class="footer">
    <p>AiLip · LatentSync + CodeFormer + Real-ESRGAN · Open Source</p>
  </footer>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
